name: Deployment
run-name: >-
  Deploy ${{ github.event.workflow_run.head_branch || github.ref_name }} to ${{
  (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'prod'
  || 'preview' }}

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Deploy a branch once "Build and test" passed on it. main is excluded because
  # the push trigger above already covers it — otherwise every merge would fire
  # two concurrent production deploys of the same commit.
  workflow_run:
    workflows: ['Build and test']
    types: [completed]
    branches-ignore: [main]

env:
  NITRO_PRESET: 'cloudflare_module'
  NODE_VERSION: '24.x'
  PNPM_VERSION: '11'

permissions:
  contents: read
  # Recording the deployment on the commit, so it shows up in its pull request.
  deployments: write

# One deploy at a time per branch; a newer commit supersedes an in-flight run.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run also fires when the tests failed, and for a fork PR the head
    # commit is untrusted code — neither may reach the production credentials.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A workflow_run job runs the workflow file from the default branch and
          # checks out its SHA by default; we want the commit that was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build (angular)
        run: pnpm run build

      # main goes live; any other branch is uploaded as a Workers *version*,
      # reachable on its own preview URL without taking production traffic.
      - name: Resolve wrangler command
        id: target
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [ "$BRANCH" = 'main' ]; then
            echo 'mode=prod' >> "$GITHUB_OUTPUT"
            echo 'environment=production' >> "$GITHUB_OUTPUT"
            echo 'command=deploy' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Preview aliases are subdomain labels: lowercase, alphanumeric, dashes.
          alias=$(printf '%s' "$BRANCH" |
            tr '[:upper:]' '[:lower:]' |
            tr -cs 'a-z0-9' '-' |
            cut -c1-40 |
            sed -e 's/^-*//' -e 's/-*$//')
          echo 'mode=preview' >> "$GITHUB_OUTPUT"
          echo "environment=preview-${alias:-branch}" >> "$GITHUB_OUTPUT"
          echo "command=versions upload --preview-alias ${alias:-branch}" >> "$GITHUB_OUTPUT"

      # Marks the commit as being deployed, which surfaces as a deployment box in
      # its pull request. Created before wrangler runs so a failed deploy is
      # recorded too, instead of leaving the PR with no trace at all.
      - name: Create GitHub deployment
        id: github-deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          # required_contexts must be empty, otherwise GitHub refuses to create a
          # deployment for a commit whose checks are not all green yet (409), and
          # auto_merge must be off, otherwise it answers 202 without deploying.
          id=$(jq -n \
            --arg ref "$SHA" \
            --arg environment "$ENVIRONMENT" \
            --arg description "Cloudflare Workers ($MODE)" \
            --argjson production "$([ "$MODE" = 'prod' ] && echo true || echo false)" \
            '{
              ref: $ref,
              environment: $environment,
              description: $description,
              production_environment: $production,
              transient_environment: ($production | not),
              auto_merge: false,
              required_contexts: []
            }' |
            gh api "repos/$GITHUB_REPOSITORY/deployments" \
              --method POST --input - --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: ${{ steps.target.outputs.command }}

      - name: print deployment-url
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          WRANGLER_COMMAND: ${{ steps.target.outputs.command }}
          MODE: ${{ steps.target.outputs.mode }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          DEPLOYMENT_ID: ${{ steps.github-deployment.outputs.id }}
        run: |
          echo "$MODE ($BRANCH): wrangler $WRANGLER_COMMAND -> ${DEPLOYMENT_URL:-no url reported}"
          {
            echo "### $MODE — \`$BRANCH\`"
            echo "\`wrangler $WRANGLER_COMMAND\`"
            echo "${DEPLOYMENT_URL:-No URL reported by wrangler.}"
          } >> "$GITHUB_STEP_SUMMARY"

          # "Playwright Tests" runs on workflow_run and cannot read step outputs
          # from this run, so hand them over as an artifact. It reports back on
          # the deployment, hence the id and the environment travelling along.
          jq -n \
            --arg url "$DEPLOYMENT_URL" \
            --arg environment "$ENVIRONMENT" \
            --argjson deployment_id "${DEPLOYMENT_ID:-null}" \
            '{url: $url, environment: $environment, deployment_id: $deployment_id}' \
            > deployment.json

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v6
        with:
          name: deployment
          path: deployment.json
          retention-days: 7

      # Closes the deployment out either way: "View deployment" in the pull
      # request then points at the url wrangler reported.
      - name: Report GitHub deployment status
        if: always() && steps.github-deployment.outputs.id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.github-deployment.outputs.id }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          STATE: ${{ steps.deploy.outcome == 'success' && 'success' || 'failure' }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg state "$STATE" \
            --arg environment "$ENVIRONMENT" \
            --arg environment_url "$DEPLOYMENT_URL" \
            --arg log_url "$LOG_URL" \
            '{state: $state, environment: $environment, log_url: $log_url}
              + (if $environment_url == "" then {} else {environment_url: $environment_url} end)' |
            gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
              --method POST --input - --jq '"\(.state) -> \(.environment_url // "no url")"'
